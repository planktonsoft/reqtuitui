name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview
      
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Install cargo-llvm-cov and cargo-crap
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov,cargo-crap

    - name: Run tests & Generate coverage
      run: cargo llvm-cov --workspace --lcov --output-path lcov.info

    - name: CRAP Score Report (Non-blocking)
      run: |
        cargo crap --workspace --lcov lcov.info --threshold 8 --format markdown >> $GITHUB_STEP_SUMMARY || true
        cargo crap --workspace --lcov lcov.info --threshold 8 || true
