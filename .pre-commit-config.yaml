# See https://pre-commit.com for more information
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-crap
        name: cargo crap (gatekeeper)
        entry: bash -c 'cargo llvm-cov --workspace --lcov --output-path lcov.info && cargo crap --workspace --lcov lcov.info --threshold 8 --fail-above'
        language: system
        types: [rust]
        pass_filenames: false
